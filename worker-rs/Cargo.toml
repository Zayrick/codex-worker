[package]
name = "codex-worker-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Rust/WebAssembly backend for codex-worker on Cloudflare Workers"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
dwarf-debug-info = true

[dependencies]
aes-gcm = "0.11.0"
async-stream = "0.3.6"
async-trait = "0.1.91"
base64 = "0.23.1"
futures-util = "0.3.33"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hmac = "0.13.0"
percent-encoding = "2.3.2"
ruzstd = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.19"
tiktoken = "3.5.1"
time = { version = "0.3.55", features = ["parsing"] }
url = "2.5.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "debuginfo"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.5"
